name: Tauri Build (Windows)

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      # Install Node (for frontend)
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 18

      # Install Rust
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      # Install frontend dependencies
      - name: Install dependencies
        run: npm install

      # Build frontend (IMPORTANT)
      - name: Build frontend
        run: npm run build

      # Build Tauri app (this generates .exe)
      - name: Build Tauri
        run: npm run tauri build

      # Upload installer
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tauri-windows-build
          path: src-tauri/target/release/bundle/
